name: Build

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "postmarketOS UI (console, phosh, sxmo, ...)"
        required: false
        default: "console"
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      UI: ${{ github.event.inputs.ui || 'console' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-requests \
            git kpartx util-linux e2fsprogs \
            openssl tar bzip2 xz-utils \
            qemu-user-static binfmt-support

      - name: Clone pmbootstrap
        run: |
          git clone --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap

      - name: Prepare pmaports with device overlay
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          mkdir -p "$PMAPORTS"
          git clone --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMAPORTS"
          cp -r packages/device-oneplus-instantnoodle "$PMAPORTS/device/testing/"
          cp -r packages/linux-oneplus-instantnoodle "$PMAPORTS/device/testing/"
          cp -r packages/firmware-oneplus-instantnoodle "$PMAPORTS/device/testing/"
          cp -r packages/alsa-oneplus-instantnoodle "$PMAPORTS/device/testing/"

      - name: Pre-seed pmbootstrap config
        run: |
          CFG="$HOME/.config/pmbootstrap_v3.cfg"
          mkdir -p "$(dirname "$CFG")"
          cat > "$CFG" <<'EOF'
          [pmbootstrap]
          device = oneplus-instantnoodle
          kernel = oneplus-instantnoodle
          ui = console
          EOF

      - name: Init pmbootstrap (non-interactive)
        run: |
          cd /tmp/pmbootstrap
          yes "" | ./pmbootstrap.py -y init

      - name: Set UI
        run: |
          cd /tmp/pmbootstrap
          ./pmbootstrap.py config ui "$UI"

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.local/var/pmbootstrap/packages
            /home/runner/.local/var/pmbootstrap/config_abuild
            /home/runner/.local/var/pmbootstrap/config_apk_keys
            /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64
            /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          key: pmos-cache-${{ github.sha }}
          restore-keys: |
            pmos-cache-

      - name: Install fixed signing keys
        run: |
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p "$WORK/config_abuild" "$WORK/config_apk_keys"
          cp ci/keys/abuild.conf ci/keys/pmos@local-ci.rsa ci/keys/pmos@local-ci.rsa.pub "$WORK/config_abuild/"
          cp ci/keys/pmos@local-ci.rsa.pub "$WORK/config_apk_keys/"
          chmod 644 "$WORK/config_abuild/pmos@local-ci.rsa"
          chmod -R a+rwX "$WORK/packages" || true
          echo "installed keys:"
          ls -la "$WORK/config_abuild" "$WORK/config_apk_keys"

      - name: Build image
        run: |
          cd /tmp/pmbootstrap
          ./pmbootstrap.py -y -j 2 install --password 147147

      - name: Dump pmbootstrap log on failure
        if: failure()
        run: |
          echo "=== df -h ==="
          df -h
          echo "=== pmbootstrap log.txt tail ==="
          tail -n 200 "$HOME/.local/var/pmbootstrap/log.txt" 2>/dev/null || true

      - name: Upload built packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-packages
          path: /home/runner/.local/var/pmbootstrap/packages
          retention-days: 7

      - name: Make cache paths readable
        run: |
          sudo chmod -R a+rX "$HOME/.local/var/pmbootstrap/config_abuild" \
            "$HOME/.local/var/pmbootstrap/config_apk_keys" || true

      - name: Save build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/.local/var/pmbootstrap/packages
            /home/runner/.local/var/pmbootstrap/config_abuild
            /home/runner/.local/var/pmbootstrap/config_apk_keys
            /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64
            /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          key: pmos-cache-${{ github.sha }}

      - name: Verify build cache saved
        if: success()
        shell: bash
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/caches" \
              | grep -q "pmos-cache-${{ github.sha }}"; then
              echo "CACHE OK: pmos-cache-${{ github.sha }}"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: cache pmos-cache-${{ github.sha }} was NOT saved"
          exit 1

      - name: Export artifacts
        run: |
          cd /tmp/pmbootstrap
          ./pmbootstrap.py export ./export
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          tar -ch -C ./export -f "$GITHUB_WORKSPACE/artifacts/export.tar" .
          cp -aL ./export/. "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          echo "=== full export inventory ==="
          find "$GITHUB_WORKSPACE/artifacts/" -type f -printf '%P %s bytes\n' | sort
          for f in boot.img dtbo.img; do
            test -f "$GITHUB_WORKSPACE/artifacts/$f" && test -s "$GITHUB_WORKSPACE/artifacts/$f" \
              || { echo "ERROR: missing/empty $f"; exit 1; }
          done
          find "$GITHUB_WORKSPACE/artifacts/" -name '*.img' | grep -q . \
            || { echo "ERROR: missing rootfs image"; exit 1; }
          find "$GITHUB_WORKSPACE/artifacts/dtbs/" -name '*.dtb' | grep -q . \
            || { echo "ERROR: dtbs not exported"; exit 1; }
          test -s "$GITHUB_WORKSPACE/artifacts/export.tar" \
            || { echo "ERROR: export.tar empty"; exit 1; }
          echo "EXPORT VERIFIED OK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-oneplus-instantnoodle
          path: artifacts/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
          if-no-files-found: ignore
