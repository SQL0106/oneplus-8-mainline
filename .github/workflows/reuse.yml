name: Reuse build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-requests \
            git kpartx util-linux e2fsprogs \
            openssl tar bzip2 xz-utils \
            qemu-user-static binfmt-support

      - name: Clone pmbootstrap
        run: |
          git clone --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap

      - name: Prepare pmaports with device overlay
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          mkdir -p "$PMAPORTS"
          git clone --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMAPORTS"
          cp -r packages/device-oneplus-instantnoodle "$PMAPORTS/device/testing/"
          cp -r packages/linux-oneplus-instantnoodle "$PMAPORTS/device/testing/"
          cp -r packages/firmware-oneplus-instantnoodle "$PMAPORTS/device/testing/"
          cp -r packages/alsa-oneplus-instantnoodle "$PMAPORTS/device/testing/"

      - name: Pre-seed pmbootstrap config
        run: |
          CFG="$HOME/.config/pmbootstrap_v3.cfg"
          mkdir -p "$(dirname "$CFG")"
          cat > "$CFG" <<'EOF'
          [pmbootstrap]
          device = oneplus-instantnoodle
          kernel = oneplus-instantnoodle
          ui = console
          EOF

      - name: Init pmbootstrap (non-interactive)
        run: |
          cd /tmp/pmbootstrap
          yes "" | ./pmbootstrap.py -y init
          ./pmbootstrap.py config build_pkgs_on_install false

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.local/var/pmbootstrap/packages
            /home/runner/.local/var/pmbootstrap/config_abuild
            /home/runner/.local/var/pmbootstrap/config_apk_keys
            /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64
            /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          key: pmos-cache-${{ github.sha }}
          restore-keys: |
            pmos-cache-

      - name: Install fixed signing keys
        run: |
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p "$WORK/config_abuild" "$WORK/config_apk_keys"
          cp ci/keys/abuild.conf ci/keys/pmos@local-ci.rsa ci/keys/pmos@local-ci.rsa.pub "$WORK/config_abuild/"
          cp ci/keys/pmos@local-ci.rsa.pub "$WORK/config_apk_keys/"
          chmod 644 "$WORK/config_abuild/pmos@local-ci.rsa"
          echo "installed keys:"
          ls -la "$WORK/config_abuild" "$WORK/config_apk_keys"

      - name: Verify cache restored
        shell: bash
        run: |
          if [ -z "$(find "$HOME/.local/var/pmbootstrap/packages" -name '*.apk' 2>/dev/null | head -1)" ]; then
            echo "ERROR: build cache NOT restored (no packages found)"
            exit 1
          fi
          echo "CACHE RESTORED: $(find "$HOME/.local/var/pmbootstrap/packages" -name '*.apk' | wc -l) apk files"
          ls -la "$HOME/.local/var/pmbootstrap/packages/edge/aarch64/" 2>/dev/null || true

      - name: Build image (no compilation; fails if packages missing)
        run: |
          cd /tmp/pmbootstrap
          ./pmbootstrap.py -y -j 2 install --password 147147

      - name: Dump pmbootstrap log on failure
        if: failure()
        run: |
          echo "=== df -h ==="
          df -h
          echo "=== pmbootstrap log.txt tail ==="
          tail -n 200 "$HOME/.local/var/pmbootstrap/log.txt" 2>/dev/null || true

      - name: Export artifacts
        run: |
          cd /tmp/pmbootstrap
          ./pmbootstrap.py export ./export
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          tar -ch -C ./export -f "$GITHUB_WORKSPACE/artifacts/export.tar" .
          cp -aL ./export/. "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          echo "=== full export inventory ==="
          find "$GITHUB_WORKSPACE/artifacts/" -type f -printf '%P %s bytes\n' | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-oneplus-instantnoodle
          path: artifacts/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
          if-no-files-found: ignore
